name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:docs
      - run: bun run smoke:npm

  binary:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          # GitHub retired Intel (x64) hosted macOS runners; macos-13 jobs queue
          # forever with no runner to pick them up. Bun cross-compiles, so the
          # x64 binary builds fine on the arm64 host - the smoke test that runs
          # it uses the Rosetta 2 install every macos-14/15 runner ships with.
          - os: macos-14
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: bun run build:binaries ${{ matrix.target }}
      - name: Smoke test binary
        shell: bash
        run: ./artifacts/earshot-${{ matrix.target }}${{ startsWith(matrix.target, 'windows-') && '.exe' || '' }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: earshot-${{ matrix.target }}
          path: artifacts/earshot-${{ matrix.target }}*

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: sha256sum artifacts/* > artifacts/SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      # No --provenance: npm can only verify a provenance bundle when the source
      # repository is public, and this one is private. Publishing with the flag
      # fails at the registry (E422) rather than degrading, so the choice is
      # explicit. Restore it if the repository is ever made public.
      - run: npm publish --access public
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
